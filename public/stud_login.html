    <script>
      // document.getElementById('loginForm').addEventListener('submit', async (event) => {
      //     event.preventDefault();
      async function login() {
        const studEmail = document.getElementById("stud_email").value;
        const studPassword = document.getElementById("stud_password").value;

        try {
          const response = await fetch("/logins", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email: studEmail, password: studPassword }),
          });

          const data = await response.json();
          console.log(data);
          if (data.success) {
            window.location.href = "stud_portal.html"; // Redirects to student portal on successful login
          } else {
            alert("Invalid credentials. Please try again.");
          }
        } catch (error) {
          console.error("Error:", error.message);
          alert("Failed to log in. Please try again.");
        }
      }
    </script>
