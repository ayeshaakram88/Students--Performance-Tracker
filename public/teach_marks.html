<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Portal</title>
    <link rel="stylesheet" href="design.css">
    <link rel="stylesheet" href="navigation.css">
</head>
<body>
    <div class="main_container" id="home">
        <div class="navbar">
            <div class="logo">
                <a href="#">Student Performance Tracker</a>
            </div>
            <div class="navbar_items">
                <ul>
                    <li><a href="index.html">LOGOUT</a></li>
                    <li><a href="index.html">CONTACT US</a></li>
                    <li><a href="teach_login.html">TEACHER</a></li>
                    <li><a href="index.html">HOME</a></li>
                </ul>
            </div>
        </div> 
        <div class="banner_image">
            <div class="form-box">
                <div class="button-box">
                    <div>
                        <h2><center>Update Marks</center></h2>
                    </div>
                </div>
                <form method="POST" action="/submitMarks">
                    <input type="text" name="stud_id" class="input-field" placeholder="Enter Student ID" required>
                    <input type="text" name="sub_id" class="input-field" placeholder="Enter Subject ID" required>
                    <div>
                        <select name="month" class="input-field" required>
                            <option value="Select a Month" selected>Select a Month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <!-- Add other months here -->
                        </select>
                    </div>
                    <input type="number" name="totalf" class="input-field" placeholder="Enter Total Final Marks" required>
                    <input type="number" name="marksf" class="input-field" placeholder="Enter Final Marks" required>
                    <input type="number" name="totalm" class="input-field" placeholder="Enter Total Mids Marks" required>
                    <input type="number" name="marksm" class="input-field" placeholder="Enter Mids Marks" required>
                    
                    <!-- Allow inputting multiple quiz values -->
                    <div id="quizInputs">
                        <input type="number" name="quizNumber[]" class="input-field" placeholder="Enter Quiz Number" required>
                        <input type="number" name="quizTotal[]" class="input-field" placeholder="Enter Total Quiz Marks" required>
                        <input type="number" name="quizMarks[]" class="input-field" placeholder="Enter Quiz Marks" required>
                    </div>
                    <button type="button" onclick="addQuizField()">Add Quiz</button>
                    
                    <!-- Allow inputting multiple assignment values -->
                    <div id="assignmentInputs">
                        <input type="number" name="assignmentNumber[]" class="input-field" placeholder="Enter Assignment Number" required>
                        <input type="number" name="assignmentTotal[]" class="input-field" placeholder="Enter Total Assignment Marks" required>
                        <input type="number" name="assignmentMarks[]" class="input-field" placeholder="Enter Assignment Marks" required>
                    </div>
                    <button type="button" onclick="addAssignmentField()">Add Assignment</button>
                    
                    <div>
                        <button type="submit" name="submit" value="Submit" class="submit-btn"> Submit </button>
                    </div>
                </form>
                
                <script>
                    function addQuizField() {
                        const quizInputs = document.getElementById('quizInputs');
                        quizInputs.innerHTML += `
                            <input type="number" name="quizNumber[]" class="input-field" placeholder="Enter Quiz Number" required>
                            <input type="number" name="quizTotal[]" class="input-field" placeholder="Enter Total Quiz Marks" required>
                            <input type="number" name="quizMarks[]" class="input-field" placeholder="Enter Quiz Marks" required>
                        `;
                    }

                    function addAssignmentField() {
                        const assignmentInputs = document.getElementById('assignmentInputs');
                        assignmentInputs.innerHTML += `
                            <input type="number" name="assignmentNumber[]" class="input-field" placeholder="Enter Assignment Number" required>
                            <input type="number" name="assignmentTotal[]" class="input-field" placeholder="Enter Total Assignment Marks" required>
                            <input type="number" name="assignmentMarks[]" class="input-field" placeholder="Enter Assignment Marks" required>
                        `;
                    }
                </script>
            </div>
        </div>
    </div>
</body>
</html>
