<!-- Page 1: Student Data Entry -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page 1 - Student Data</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      select {
        width: calc(100% + 5px);
        padding: 6px;
      }
      h1 {
        text-align: center;
      }

      form {
        max-width: 400px;
        margin: 0 auto;
      }

      label,
      input,
      select {
        display: block;
        margin-bottom: 10px;
      }

      input[type="text"],
      input[type="number"] {
        width: calc(100% - 10px);
        padding: 5px;
      }

      button {
        padding: 8px 15px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <h1>Page 1 - Enter Student Data</h1>
    <form id="studentForm" method="POST" action="/page1">
      <label for="studentID">Student ID:</label>
      <input type="text" id="studentID" name="student_id" required />

      <label for="courseID">Course ID:</label>
      <input type="text" id="courseID" name="course_id" required />

      <label for="courseName">Course Name:</label>
      <input type="text" id="courseName" name="course_name" required />

      <label for="st_semester">Semester:</label>
      <select id="st_semester" name="semester" class="input-field" required>
        <option value="Select a Semester" selected>Select a Semester</option>
        <option value="Semester 1">Semester 1</option>
        <option value="Semester 2">Semester 2</option>
        <option value="Semester 3">Semester 3</option>
        <option value="Semester 4">Semester 4</option>
        <option value="Semester 5">Semester 5</option>
        <option value="Semester 6">Semester 6</option>
        <option value="Semester 7">Semester 7</option>
        <option value="Semester 8">Semester 8</option>
      </select>

      <label for="creditHours">Credit Hours Earned:</label>
      <input
        type="number"
        id="creditHours"
        name="credit_hours_earned"
        required
      />

      <button type="submit">Next</button>
    </form>
  </body>
</html>
