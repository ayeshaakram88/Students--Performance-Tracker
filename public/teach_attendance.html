                <h2><center>Update Attendance</center></h2></div>
                </div>
				<form method="POST" action="/submitAttendance">
					<input type="text" name="s_id" id="stud_id" class="input-field" placeholder="Enter Student ID" required>
					<input type="text" name="course_id" id="course_id" class="input-field" placeholder="Enter Course ID" required>
					<input type="text" name="course_name" id="course_name" class="input-field" placeholder="Enter Course Name" required>
					<input type="number" name="s_attendance" id="s_attendance" class="input-field" placeholder="Enter Student Attendance" required>
					<div>
					<select id="st_semester" name="semester" class="input-field" required>
						<option value="Select a Semester" selected>Select a Semester</option>
						<option value="Semester 1">Semester 1</option>
						<option value="Semester 2">Semester 2</option>
						<option value="Semester 3">Semester 3</option>
						<option value="Semester 4">Semester 4</option>
						<option value="Semester 5">Semester 5</option>
						<option value="Semester 6">Semester 6</option> <!--backend change-->
						<option value="Semester 7">Semester 7</option>
						<option value="Semester 8">Semester 8</option>
					</select>
					</div>
					<input type="submit" name="submit" value="Submit" class="submit-btn">
				</form>
