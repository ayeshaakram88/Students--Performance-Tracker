	<form method="POST" action="/submitStudent">
            <input type="text" name="student_id" id="st_id" class="input-field" placeholder="Enter Student ID" required>
            <input type="text" name="student_name" id="st_name" class="input-field" placeholder="Enter Student Name" required>
            <select id="st_semester" name="student_semester" class="input-field" required>
				<option value="Select a Semester" selected>Select a Semester</option>
				<option value="Semester 1">Semester 1</option>
				<option value="Semester 2">Semester 2</option>
				<option value="Semester 3">Semester 3</option>
				<option value="Semester 4">Semester 4</option>
				<option value="Semester 5">Semester 5</option>
				<option value="Semester 6">Semester 6</option> <!--backend change-->
				<option value="Semester 7">Semester 7</option>
				<option value="Semester 8">Semester 8</option>
			</select>
            <input type="text" name="student_dept" id="st_dept" class="input-field" placeholder="Enter Department" required>
            <input type="email" name="email" id="email" class="input-field" placeholder="Enter Email" required>
			<input type="number" name="phone" id="phone" class="input-field" placeholder="Enter Phone Number" required>
			<input type="text" name="fathername" id="fathername" class="input-field" placeholder="Enter Father Name" required>
            <div>
                <button type="submit" name="submit" value="Submit" class="submit-btn">Submit</button>
            </div>
        
	</form>
